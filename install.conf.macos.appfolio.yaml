- defaults:
    link:
      relink: true

- clean : ['~']

- asdf:
  - plugin: ruby
    url: https://github.com/asdf-vm/asdf-ruby.git
  - plugin: nodejs
    url: https://github.com/asdf-vm/asdf-nodejs.git
  - plugin: yarn
    url: https://github.com/twuni/asdf-yarn.git
  - plugin: golang
    url: https://github.com/asdf-community/asdf-golang.git

- shell:
  - command: which aerospace > /dev/null || (brew tap nikitabobko/tap && brew install --cask aerospace)
    description: Install AeroSpace if missing
    stdout: true
    stderr: true
  - command: which karabiner-elements > /dev/null || brew install --cask karabiner-elements
    description: Install Karabiner-Elements if missing
    stdout: true
    stderr: true
  - command: which ghostty > /dev/null || brew install --cask ghostty
    description: Install Ghostty if missing
    stdout: true
    stderr: true
  - command: which code > /dev/null && cat ~/dotfiles/vscode/extensions.txt | xargs -L1 code --install-extension --force 2>/dev/null; true
    description: Install VS Code extensions
    stdout: true
    stderr: true

- link:
    ~/.zshrc: shell/zshrc
    ~/.zimrc: shell/zimrc
    ~/.aliasrc: shell/aliasrc
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/RTK.md: claude/RTK.md
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/hooks/rtk-rewrite.sh: claude/hooks/rtk-rewrite.sh
    ~/.claude/commands/pr-actions.md: claude/commands/pr-actions.md
    ~/.claude/skills: claude/skills
    /Library/Application Support/ClaudeCode/CLAUDE.md: claude/system-CLAUDE.md
    ~/.config/karabiner/karabiner.json: karabiner/karabiner.json
    ~/.config/karabiner/assets/complex_modifications/vi-mode.json: karabiner/assets/complex_modifications/vi-mode.json
    ~/.config/aerospace/aerospace.toml: aerospace/aerospace.toml
    ~/.config/ghostty/config: ghostty/config
    ~/.config/ghostty/themes/Tinacious Design Dark: ghostty/themes/Tinacious Design Dark
    ~/Library/Application Support/Code/User/settings.json: vscode/settings.json
    ~/Library/Application Support/Code/User/keybindings.json: vscode/keybindings.json
